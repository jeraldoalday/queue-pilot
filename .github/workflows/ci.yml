name: CI

on:
  push:
    branches: [main]
  pull_request:

# A branch pushed three times in a minute does not need three full runs of
# a job that starts a database and builds everything. The newest push is
# the only one whose answer anybody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The whole job is a few minutes. A run still going after twenty is
    # hung — on the database service, or on a test waiting for something
    # that will not arrive — and should be killed rather than left to burn
    # an hour of the runner's own timeout.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queuepilot
          POSTGRES_PASSWORD: queuepilot
          POSTGRES_DB: queuepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queuepilot -d queuepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://queuepilot:queuepilot@localhost:5432/queuepilot?sslmode=disable
      ENV: development
      PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Generate templ (drift check)
        run: |
          templ generate ./...
          git diff --exit-code -- '*_templ.go' || (echo "::error::templ generate produced a diff — commit the regenerated files" && exit 1)

      - name: Generate sqlc (drift check)
        run: |
          sqlc generate
          git diff --exit-code -- internal/db/sqlc || (echo "::error::sqlc generate produced a diff — commit the regenerated files" && exit 1)

      # app.css is a committed build artifact, so a template using a class
      # Tailwind has never seen renders unstyled in production while
      # looking fine to whoever added it. This is the same drift check the
      # generated Go code gets, for the same reason.
      - name: Install Tailwind CLI
        run: ./scripts/install-tailwind.sh

      - name: Build Tailwind (drift check)
        run: |
          make tailwind-build
          git diff --exit-code -- internal/web/static/css/app.css || (echo "::error::tailwind-build produced a diff — run 'make tailwind-build' and commit internal/web/static/css/app.css" && exit 1)

      - name: Run migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      # gofmt is checked here as well as in `make check`, because the
      # Makefile's copy only runs for whoever remembers to run it. `gofmt
      # -l` prints the offending files and exits 0 either way, so the
      # output is what has to be turned into a failure.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd — run 'make fmt' and commit the result"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race

      - name: go test (integration)
        run: go test ./... -race -tags=integration -run Integration

  # The front end is a separate job on purpose. It shares no build step
  # with the Go one and needs no database, so running it alongside rather
  # than after means a broken component test is reported in the same two
  # minutes as a broken handler rather than after the Postgres service has
  # finished starting.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci rather than npm install: it installs exactly the lockfile
      # and fails if package.json has drifted from it, which is the whole
      # reason the lockfile is committed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build

      # Only the browsers the config actually launches. `--with-deps`
      # installs the system libraries a headless Chromium needs on a bare
      # runner, which is otherwise a failure that looks like a broken test.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # The report is only worth keeping when something failed — a green
      # run's artefacts are never opened, and uploading them on every push
      # is a minute per run spent on nothing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
